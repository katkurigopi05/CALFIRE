<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALFIRE Incident Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>CALFIRE Incident Dashboard</h1>
      <p class="subtitle">Local summary from California fire incident dataset.</p>

      <section class="cards" id="summary-cards"></section>

      <section class="panel">
        <h2>Recent Incidents</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Started</th>
              <th>County</th>
              <th>Acres Burned</th>
              <th>Active</th>
            </tr>
          </thead>
          <tbody id="incidents-body"></tbody>
        </table>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
